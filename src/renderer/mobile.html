<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Un téléphone tenu en main, dans une pièce sombre : on occupe l'écran
         entier, encoche comprise, et on interdit le zoom par pincement qui
         déplacerait un pion au lieu de le poser. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1518" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Posée sur l'écran d'accueil, la page s'ouvre comme une application :
         son icône, son nom, sans la barre du navigateur. Le manifeste ne dit
         pas d'adresse de départ : c'est celle du QR, invitation comprise. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Écran" />
    <link rel="manifest" href="/portable/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/portable/icone-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/portable/icone-192.png" />
    <title>Écran du Maître</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
