appId: fr.julescannet.ecrandumaitre
productName: Ecran du Maitre
# L'application n'a pas d'updater à elle : c'est Le Grenier qui compare le tag de la
# dernière release à la version installée. Le fournisseur ne sert donc qu'à `--publish`,
# qui crée la release et y joint les exécutables.
publish:
  provider: github
  owner: BlueFox71
  repo: ecran-du-maitre
  releaseType: release

directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
# L'icône des fenêtres est lue à l'exécution : elle doit voyager avec l'application.
extraResources:
  - from: resources/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch: [x64]
    # Le Grenier télécharge l'asset et le lance tel quel : il lui faut un exécutable
    # autonome, jamais l'installeur, qui ouvrirait un assistant à chaque lancement.
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Ecran du Maitre
# Le nom porte la version — c'est là-dessus que le motif du Grenier fait sa
# correspondance — et s'écrit sans espace, que GitHub remplacerait par des tirets.
portable:
  artifactName: Ecran-du-Maitre-${version}.${ext}
